server:
  port: 8083
  address: 127.0.0.1

spring:
  config:
    import: optional:nacos:order-service.yaml?group=DEFAULT_GROUP&server-addr=127.0.0.1:8848
  main:
    allow-bean-definition-overriding: true
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        fail-fast: false
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8089
        port: 8719

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-enums-package: com.campus.trade.order.entity.enums
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

internal:
  token: ${INTERNAL_TOKEN}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
