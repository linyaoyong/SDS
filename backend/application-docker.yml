spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
      config:
        server-addr: nacos:8848
  datasource:
    url: jdbc:mysql://mysql:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
  data:
    redis:
      host: redis
      port: 6379

# Each service overrides DB_NAME via environment variable:
# auth-service: DB_NAME=db_auth
# product-service: DB_NAME=db_product
# order-service: DB_NAME=db_order
# message-service: DB_NAME=db_message
